<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 8 square-tipped rays -->
  <line x1="16" y1="1"    x2="16" y2="6"     stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="square"/>
  <line x1="16" y1="26"   x2="16" y2="31"    stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="square"/>
  <line x1="1"  y1="16"   x2="6"  y2="16"    stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="square"/>
  <line x1="26" y1="16"   x2="31" y2="16"    stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="square"/>
  <line x1="5"    y1="5"    x2="8.5"  y2="8.5"  stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="square"/>
  <line x1="23.5" y1="23.5" x2="27"   y2="27"   stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="square"/>
  <line x1="27"   y1="5"    x2="23.5" y2="8.5"  stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="square"/>
  <line x1="5"    y1="27"   x2="8.5"  y2="23.5" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="square"/>
  <!-- Sun body -->
  <circle cx="16" cy="16" r="8.5" fill="#FFE500" stroke="#1a1a1a" stroke-width="2.5"/>
</svg>
